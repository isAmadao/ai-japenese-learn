# ==============================================================
#  nginx.conf — AI 日本語学習 反向代理配置
#
#  ── 本地开发 ──
#  http://localhost           — nginx 前端页面（默认）
#  http://localhost:8000      — 后端 API 直连（调试用）
#
#  ── 生产部署（解注释下方 SSL 部分） ──
#  1. 把证书放到 ./ssl/fullchain.pem 和 ./ssl/privkey.pem
#  2. 修改 docker-compose.yml 映射 ./ssl:/etc/nginx/ssl
#  3. 把 server_name 改为你的域名
#  4. 取消注释 HTTPS server 块，注释掉 HTTP server 块的 listen
# ==============================================================

# ═══════════════════════════════════════════════════════════════
#  生产环境：HTTP → HTTPS 重定向
#  取消注释即可启用。同时修改下方 HTTPS server 的 server_name。
# ═══════════════════════════════════════════════════════════════
# server {
#     listen 80;
#     server_name aijapaneselearn.com www.aijapaneselearn.com;
#     return 301 https://$host$request_uri;
# }

server {
    # 本地开发：监听 80 端口
    listen 80;

    # ── 生产环境 HTTPS（取消注释，注释掉上面的 listen 80） ──
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    # ── 服务器名称（本地开发 + 自定义本地域名） ──────────────
    server_name localhost jp.local aijapanese.local;

    charset utf-8;

    # ── Gzip 压缩 ────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               application/x-font-ttf font/opentype;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;

    # ── 安全头 ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 生产环境 HSTS（取消注释 — 确保 HTTPS 先配好）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── API 反向代理 ─────────────────────────────────────────
    # Auth API (forward to standalone auth-service)
    location /api/auth/ {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin users API (forward to auth-service — user management)
    location /api/admin/users {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin delete/restore (also on auth-service)
    location ~ ^/api/admin/users/\d+/(delete|restore)$ {
        proxy_pass http://auth-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Docker Compose DNS 自动管理容器 IP 变化，无需变量 resolver hack
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 流式响应支持（关闭缓冲）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
    }

    # ── OpenAPI docs（也走代理） ─────────────────────────────
    location /docs {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 前端静态资源（带强缓存） ─────────────────────────────
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA 入口 — 所有非 API 路由回退到 index.html ─────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
